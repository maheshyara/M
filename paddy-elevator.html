 if(P.size===1){takeover();st.az-=(e.clientX-o.clientX)*.4;st.el=Math.min(85,Math.max(2,st.el+(e.clientY-o.clientY)*.3))}
 P.set(e.pointerId,e);if(P.size===2){const[a,b]=[...P.values()];const n=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);takeover();zoomK=Math.min(3,Math.max(.2,zoomK*pd/n));pd=n}});
['pointerup','pointercancel'].forEach(n=>host.addEventListener(n,e=>P.delete(e.pointerId)));
host.addEventListener('wheel',e=>{e.preventDefault();takeover();zoomK=Math.min(3,Math.max(.2,zoomK*(1+e.deltaY*.001)))},{passive:false});
function takeover(){if(!manual){manual=true;$('bp').textContent='▶ Resume tour'}}
$('bp').onclick=()=>{if(manual){manual=false;playing=true;zoomK=1;spin=0}else playing=!playing;$('bp').textContent=playing&&!manual?'⏸ Pause':'▶ Play'};
$('br').onclick=()=>{t=0;manual=false;playing=true;zoomK=1;spin=0;$('bp').textContent='⏸ Pause'};
$('bs').onclick=()=>{manual=false;playing=false;$('bp').textContent='▶ Play';spinAnim=360};
$('bc').onclick=()=>{circ=!circ};$('bz').onclick=()=>{takeover();zoomK=Math.max(.2,zoomK*.8)};$('bm').onclick=()=>{takeover();zoomK=Math.min(3,zoomK*1.25)};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing&&!manual){t+=dt;if(t>=TL)t=0}
 if(spinAnim>0){const s=Math.min(spinAnim,dt*45);spin+=s;spinAnim-=s;if(spinAnim<=0)spin=0}
 if(!manual)tour();sim(dt);place();
 const show=circ||(!manual&&flag);$('dg').style.display=show?'block':'none';
 lbs.forEach((d,i)=>{d.style.display=show?'block':'none';if(show){const v=V(nodes[i][1],nodes[i][2],nodes[i][3]).project(cam);
  if(v.z>1){d.style.display='none';return}d.style.transform=`translate(${(v.x*.5+.5)*innerWidth-20}px,${(-v.y*.5+.5)*innerHeight}px)`}});
 $('pr').style.width=(t/TL*100)+'%';const m=Math.floor(t);$('tm').textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' / 1:30';
 R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
